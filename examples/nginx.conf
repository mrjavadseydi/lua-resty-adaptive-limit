# Complete OpenResty configuration for lua-resty-adaptive-limit.
#
# Run with (from the repository root):
#   docker run --rm -p 8080:8080 -v $PWD:/work -w /work \
#       lua-resty-adaptive-limit/harness \
#       nginx -p /tmp/ex -c /work/examples/nginx.conf
# (create /tmp/ex first; see benchmark/resilience.sh for the same
# pattern scripted end-to-end)

worker_processes auto;
error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    # REQUIRED: a dedicated zone. Do not share it with arbitrary
    # application caches. Sizing guidance in README.md.
    lua_shared_dict adaptive_limit 10m;

    lua_package_path "/work/lib/?.lua;/work/examples/?.lua;;";  # adjust to your deployment

    # Early validation: an invalid limiter configuration must fail the
    # whole start, not the first request.
    init_by_lua_block {
        require("basic")
    }

    # Per worker: start the scheduler; reconcile held slots on exit.
    init_worker_by_lua_block {
        assert(require("resty.adaptive_limit").start())
    }

    exit_worker_by_lua_block {
        require("resty.adaptive_limit").exit()
    }

    upstream payments_backend {
        server 127.0.0.1:9001;
        keepalive 32;
    }

    server {
        listen 8080;

        # Admission + completion accounting around the protected upstream.
        location /api/ {
            # guard() admits, or answers 503 + Retry-After (500 on a
            # limiter-internal error). Use access()/enforce() to choose
            # the response yourself.
            access_by_lua_block {
                require("resty.adaptive_limit").get("payments"):guard()
            }

            proxy_pass http://payments_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            log_by_lua_block {
                -- Must run BEFORE any other log_by_lua work in this
                -- location: release accounting precedes telemetry.
                require("resty.adaptive_limit").get("payments"):log()
            }
        }

        # Status endpoint for humans and scrapers (not on the hot path).
        location /adaptive_status {
            content_by_lua_block {
                local limiters = require("basic")
                ngx.header.content_type = "application/json"
                local cjson = require "cjson.safe"
                ngx.say(cjson.encode(limiters.snapshots()))
            }
        }
    }
}
