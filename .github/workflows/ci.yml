name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # release.yml runs the full suite before publishing

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build harness
        run: docker build -t adlim-harness -f docker/Dockerfile.test .
      - name: busted unit tests, fuzz properties, simulations
        run: docker run --rm -v "$PWD":/work -w /work adlim-harness busted spec/

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # representative stable / latest. The minimum supported version
        # (1.19.3.1) is covered by the smoke job below: Test::Nginx >= 0.30
        # starts nginx with -e, which nginx < 1.19.5 does not accept.
        openresty:
          - openresty/openresty:1.21.4.4-1-bookworm
          - openresty/openresty:1.31.1.1-3-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Build harness on ${{ matrix.openresty }}
        run: |
          docker build -t adlim-harness \
            --build-arg OPENRESTY_IMAGE=${{ matrix.openresty }} \
            -f docker/Dockerfile.test .
      - name: Test::Nginx integration suite
        run: |
          docker run --rm -v "$PWD":/work -w /work adlim-harness \
            sh -c 'TEST_NGINX_SERVROOT=/tmp/adlim-servroot prove -I. -r t/'

  minimum-version:
    # The documented floor is OpenResty 1.19.3.1: exit_worker_by_lua*
    # first shipped in lua-nginx-module 0.10.18 (1.15.8.x and 1.17.8.x
    # reject the directive). The smoke script covers the library's code
    # paths; `nginx -t` on the example config covers the directives the
    # README requires, which the resty CLI never loads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build minimum-version harness
        run: |
          docker build --platform linux/amd64 \
            --build-arg OPENRESTY_IMAGE=openresty/openresty:1.19.3.1-1-bionic \
            -t adlim-harness-min -f docker/Dockerfile.test .
      - name: Smoke test on OpenResty 1.19.3.1
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work adlim-harness-min \
            resty --http-conf "lua_shared_dict smoke_dict 1m;" \
            -I /work/lib t/smoke_min_version.lua
      - name: Example config loads on OpenResty 1.19.3.1
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/work -w /work adlim-harness-min \
            sh -c 'mkdir -p /tmp/ex/logs && nginx -t -p /tmp/ex -c /work/examples/nginx.conf'
