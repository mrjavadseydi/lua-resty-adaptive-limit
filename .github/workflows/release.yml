name: Release

# Push a tag vX.Y.Z (after `make release-check VERSION=X.Y.Z` passes
# locally) and this workflow verifies, tests, and publishes:
#
#   1. check    - scripts/check-release.sh: versions, rockspecs, changelog agree
#   2. test     - the full CI suite (unit, integration matrix, minimum version)
#   3. github   - GitHub Release with the CHANGELOG section as notes
#   4. luarocks - needs secret LUAROCKS_API_KEY (luarocks.org > Settings > API keys)
#   5. opm      - needs secret OPM_GITHUB_TOKEN (GitHub PAT with read:org and
#                 user:email scopes, account mrjavadseydi; see opm docs)
#
# Publishing jobs whose secret is not configured are skipped with a warning
# annotation, so the GitHub Release still happens and the rest can be
# uploaded by hand (see CONTRIBUTING.md "Releasing").

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Release consistency
        run: bash scripts/check-release.sh "${{ steps.v.outputs.version }}"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  github:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG
        run: bash scripts/check-release.sh --notes "${{ needs.check.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check.outputs.version }}"
          gh release create "v$v" \
            --title "v$v" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "lua-resty-adaptive-limit-$v-1.rockspec"

  luarocks:
    needs: [check, test]
    runs-on: ubuntu-latest
    env:
      LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without API key
        if: env.LUAROCKS_API_KEY == ''
        run: echo "::warning::LUAROCKS_API_KEY is not set; LuaRocks upload skipped"
      - name: Install Lua 5.1
        if: env.LUAROCKS_API_KEY != ''
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"
      - name: Install LuaRocks
        if: env.LUAROCKS_API_KEY != ''
        uses: leafo/gh-actions-luarocks@v4
      - name: Upload dependencies
        # `luarocks upload` needs dkjson; HTTP goes through curl when
        # LuaSocket is absent, which is fine on the hosted runners.
        if: env.LUAROCKS_API_KEY != ''
        run: luarocks install dkjson
      - name: Upload release rockspec
        if: env.LUAROCKS_API_KEY != ''
        run: |
          v="${{ needs.check.outputs.version }}"
          luarocks upload "lua-resty-adaptive-limit-$v-1.rockspec" --api-key="$LUAROCKS_API_KEY"
      - name: Refresh dev rockspec (luarocks install --dev)
        if: env.LUAROCKS_API_KEY != ''
        run: |
          luarocks upload lua-resty-adaptive-limit-dev-1.rockspec \
            --api-key="$LUAROCKS_API_KEY" --skip-pack --force

  opm:
    needs: [check, test]
    runs-on: ubuntu-latest
    env:
      OPM_GITHUB_TOKEN: ${{ secrets.OPM_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without token
        if: env.OPM_GITHUB_TOKEN == ''
        run: echo "::warning::OPM_GITHUB_TOKEN is not set; OPM upload skipped"
      - name: opm upload
        if: env.OPM_GITHUB_TOKEN != ''
        # The official OpenResty images ship opm. The token is passed as an
        # env var and written inside the container only, never echoed.
        run: |
          docker run --rm -e OPM_GITHUB_TOKEN -v "$PWD":/src -w /src \
            openresty/openresty:1.31.1.1-3-jammy sh -ec '
              command -v opm >/dev/null || { echo "opm not found in image" >&2; exit 1; }
              # opm uploads with curl, which the slim image may lack
              command -v curl >/dev/null || {
                apt-get update -qq && apt-get install -y -qq curl >/dev/null; }
              printf "%s\n" \
                "github_account=mrjavadseydi" \
                "github_token=$OPM_GITHUB_TOKEN" \
                "upload_server=https://opm.openresty.org" \
                "download_server=https://opm.openresty.org" > "$HOME/.opmrc"
              chmod 600 "$HOME/.opmrc"
              opm upload
              opm clean dist'
