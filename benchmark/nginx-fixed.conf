# Benchmark reference: a minimal fixed shared-dict concurrency counter —
# the same admission shape as resty.limit.conn (get limit, atomic incr,
# rollback on reject, decr on completion) without any adaptation. This
# isolates the cost of the adaptive machinery on top of the shared-dict
# floor (spec §69's comparison).
worker_processes 1;
error_log /tmp/bench-fixed/logs/error.log warn;
pid /tmp/bench-fixed/logs/nginx.pid;

events { worker_connections 4096; }

http {
    lua_package_path '/tmp/bench-fixed/lib/?.lua;;';
    lua_shared_dict bench_limit 10m;

    init_worker_by_lua_block {
        local d = ngx.shared.bench_limit
        d:set("limit", 1000000)
        d:set("inflight", 0)
    }

    server {
        listen 8080;
        location /work {
            access_by_lua_block {
                local d = ngx.shared.bench_limit
                local limit = d:get("limit")
                local n = d:incr("inflight", 1, 0)
                if n and n <= limit then
                    return
                end
                if n then
                    d:incr("inflight", -1)
                end
                ngx.status = 503
                ngx.say("rejected")
                ngx.exit(503)
            }
            content_by_lua_block {
                ngx.sleep(0.001)
                ngx.say("ok")
            }
            log_by_lua_block {
                ngx.shared.bench_limit:incr("inflight", -1)
            }
        }
    }
}
