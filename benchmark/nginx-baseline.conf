# Benchmark baseline: identical request shape, no limiter at all.
# Generated files (pid, logs, lib copy) live under /tmp/bench-baseline.
worker_processes 1;
error_log /tmp/bench-baseline/logs/error.log warn;
pid /tmp/bench-baseline/logs/nginx.pid;

events { worker_connections 4096; }

http {
    lua_package_path '/tmp/bench-baseline/lib/?.lua;;';

    init_worker_by_lua_block {
        BENCH = { n = 0 }
    }

    server {
        listen 8080;
        location /work {
            content_by_lua_block {
                ngx.sleep(0.001) -- same minimal "upstream" as the others
                ngx.say("ok")
            }
        }
    }
}
