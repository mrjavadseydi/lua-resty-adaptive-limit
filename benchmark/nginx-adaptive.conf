# Benchmark target: the full adaptive limiter on the request lifecycle
# path, with the scheduler/controller running. run.sh selects the
# scenario profile via the BENCH_PROFILE environment variable:
#   huge    -> limit 100000: admission never rejects (below-limit cost)
#   tiny    -> limit 2 under heavy concurrency (heavy rejection path)
#   ctrl    -> limit 40, 5ms upstream (controller active + shedding)
#   many16  -> same as huge, plus 15 more limiters the scheduler serves
# BENCH_SLEEP_MS scales the simulated upstream latency.
worker_processes 1;
error_log /tmp/bench-adaptive/logs/error.log warn;
pid /tmp/bench-adaptive/logs/nginx.pid;
env BENCH_PROFILE;
env BENCH_SLEEP_MS;

events { worker_connections 4096; }

http {
    lua_package_path '/tmp/bench-adaptive/lib/?.lua;;';
    lua_shared_dict adaptive_limit 10m;

    init_worker_by_lua_block {
        local adaptive = require("resty.adaptive_limit")
        local profile = os.getenv("BENCH_PROFILE") or "huge"
        local cap = { huge = 100000, tiny = 2, ctrl = 40, many16 = 100000 }
        PAY = assert(adaptive.new({
            name = "pay", shared_dict = "adaptive_limit",
            initial_limit = cap[profile], min_limit = 1,
            max_limit = cap[profile],
            sample_window = 0.5, aggregation_grace = 0.25,
        }))
        if profile == "many16" then
            for i = 1, 15 do
                assert(adaptive.new({ name = "extra" .. i,
                    shared_dict = "adaptive_limit",
                    initial_limit = 100000, min_limit = 1,
                    max_limit = 100000 }))
            end
        end
        assert(adaptive.start())
    }

    server {
        listen 8080;
        location /work {
            access_by_lua_block {
                local ok, err = PAY:access()
                if not ok then
                    ngx.status = 503
                    ngx.say("rejected")
                    ngx.exit(503)
                end
            }
            content_by_lua_block {
                ngx.sleep((tonumber(os.getenv("BENCH_SLEEP_MS")) or 1) / 1000)
                ngx.say("ok")
            }
            log_by_lua_block { PAY:log() }
        }
    }
}
